<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" width="1400" height="240" role="img" aria-label="Hidden Dungeon Portal Panel" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#07132a"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17407a"/>
      <stop offset="50%" stop-color="#5be7ff"/>
      <stop offset="100%" stop-color="#2f89ff"/>
    </linearGradient>
    <linearGradient id="buttonStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4d82"/>
      <stop offset="50%" stop-color="#5be7ff"/>
      <stop offset="100%" stop-color="#1b4d82"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5be7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5be7ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5be7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#19407a" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1400" height="240" fill="url(#bgGradient)"/>
  <rect width="1400" height="240" fill="url(#gridPattern)"/>

  <!-- Outer & Inner Neon HUD Frame -->
  <rect x="60" y="24" width="1280" height="192" rx="8" fill="#081226" fill-opacity="0.75" stroke="url(#neonStroke)" stroke-width="2.6" filter="url(#softGlow)" opacity="0.9"/>
  <rect x="84" y="42" width="1232" height="156" rx="6" fill="none" stroke="#5be7ff" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Pulsing Corner Accents -->
  <path d="M 60 24 H 180 M 1220 24 H 1340 M 60 216 H 180 M 1220 216 H 1340" stroke="#5be7ff" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- Accent Divider Lines -->
  <path d="M 120 72 H 1280 M 120 156 H 1280" stroke="#5be7ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Vertical Scanline Animation -->
  <rect x="84" y="-50" width="1232" height="60" fill="url(#scanLine)">
    <animate attributeName="y" values="-60;240" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Light Particles -->
  <g fill="#5be7ff" fill-opacity="0.7" filter="url(#softGlow)">
    <circle cx="200" cy="70" r="2">
      <animate attributeName="cy" values="70;170;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="160" r="2.2">
      <animate attributeName="cy" values="160;60;160" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text Content -->
  <g font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" text-anchor="middle">
    <!-- Top System Header Tag -->
    <text x="700" y="66" font-size="13" font-weight="600" fill="#5be7ff" letter-spacing="4" opacity="0.85">[SYSTEM ANNOUNCEMENT]</text>

    <!-- Main Title -->
    <text x="700" y="108" font-size="32" font-weight="800" fill="#d3eeff" letter-spacing="3.5" filter="url(#softGlow)">A HIDDEN DUNGEON HAS APPEARED</text>

    <!-- Konami Code -->
    <text x="700" y="142" font-size="15" font-weight="600" fill="#7bc8ff" letter-spacing="5">↑  ↑  ↓  ↓  ←  →  ←  →  B  A</text>

    <!-- Interactive CTA Button -->
    <g transform="translate(0, 0)">
      <rect x="510" y="162" width="380" height="32" rx="4" fill="#0d254c" fill-opacity="0.85" stroke="url(#buttonStroke)" stroke-width="1.5" filter="url(#softGlow)"/>
      <rect x="510" y="162" width="380" height="32" rx="4" fill="none" stroke="#5be7ff" stroke-width="1.2" opacity="0.5">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="700" y="183" font-size="13" font-weight="700" fill="#5be7ff" letter-spacing="2">ACCESS PERSONAL WEBSITE ➔</text>
    </g>
  </g>
</svg>
